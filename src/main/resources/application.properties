spring.application.name=split-bill-api
server.port=${PORT:4110}

# H2 Database Configuration (Local file-based so data persists, and accessible via console)
spring.datasource.url=jdbc:h2:file:./data/splitbill;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Personalization: GitHub username (can be overridden via environment variable GITHUB_USERNAME)
app.github.username=${GITHUB_USERNAME:allobankcandidate}
